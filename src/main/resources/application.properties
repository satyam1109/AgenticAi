spring.application.name=simple-chat
# Load local credentials from the project working directory; this file is not packaged.
spring.config.import=optional:file:./secret.properties
spring.mvc.problemdetails.enabled=true

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8092}

# Previous Gemini settings (inactive; kept for reference).
# GEMINI_API_KEY is kept in secret.properties for the inactive Gemini integration.
# spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# This model responded successfully in the live connection check.
# spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# Show provider errors promptly instead of retrying repeatedly while learning.
spring.ai.retry.max-attempts=1

weather.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.forecast-url=https://api.open-meteo.com/v1/forecast

# Search uses Serper directly; the LLM is only used by the main agent.
serper.api.key=${SERPER_API_KEY:}
serper.api.url=https://google.serper.dev/search
# Shopping shares the same Serper key; this endpoint returns product listings.
serper.shopping.url=https://google.serper.dev/shopping

# Maximum duration of one progress stream (milliseconds).
chat.stream.timeout-ms=120000

# Limit each Gemini HTTP call, including its one short retry for HTTP 503 or a transport failure.
# gemini.request-timeout-ms=60000

# Active model: Qwen3.7 Flash through the same OpenRouter connection.
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# OPENAI_API_KEY holds the OpenRouter key and is loaded from secret.properties.
spring.ai.openai.api-key=${OPENAI_API_KEY}
# Previous model (uncomment this and comment the Qwen line to switch back).
# spring.ai.openai.chat.model=openai/gpt-4.1-nano
spring.ai.openai.chat.model=qwen/qwen3.7-flash
# Previous Nano-specific setting; omit it for Qwen.
# spring.ai.openai.chat.parallel-tool-calls=false
spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=1

# Default directory for relative paths used by the filesystem tools.
agent.files.base-path=/Users/satyamsingh/Desktop/projects/test_agent

# Learning mode: show filesystem steps plus complete tool arguments/results (including file text).
# Change DEBUG to INFO to keep the steps but hide full argument/result payloads.
logging.level.com.example.weatheragent.service.FileSystemService=DEBUG
